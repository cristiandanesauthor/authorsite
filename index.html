                    <div class="novel-image-container obsolescence-story">
                        <div>
                            <h1>Obsolescence</h1>
                            <p class="obsolescence-opening">Bolo Benito’s teachers had been cherry-picked from the planet’s experts, la crème-de-la-crème, though even they had been unskilled next to automation that ran the world. The statistics, motivational messages, repeated mantras, even the very lessons those experts taught had been generated by the same sentient machines that constrained Bolo’s future options. All had been provided under the guise that humans still served a purpose and schooling would aid in life.</p>
                            <p>
                            Now that Bolo’s studies were completed, he allowed the cloak to lift, letting reality seep in, though what followed left him dumbstruck.</p>
                            <p>
                            “I feel I’m just waiting to grow old and die,” said Carissa, mirroring his thoughts. “I wish I had things to do, things that mattered.” She was perched on a thick branch of a great oak on Bolo’s estate grounds. Not his parents’ estate, but his own, gifted to him when he had turned ten.</p>
                            <p>
                            Bolo leaned back on the trunk of the same tree, gazing upwards at Carissa as she shifted her legs back and forth. Sunlight sparkled through the leaves, unwelcome rays of heat. He blinked the points of brightness away.</p>
                            <p>
                            “What are we even living for?” said Carissa. “We would have been better off being born poor.”</p>
                            <p>
                            “Oh please,” said Bolo. “You wouldn’t last a day on UBI alone.”</p>
                            <p>
                            “But I could have stood a chance at a career. Some of those districts can’t afford to be fully automated. They still need trained people like myself.”</p>
                            <p>
                            “Nothing is stopping you from applying to one.”</p>
                            <p>
                            “Like they’d hire a shareholder.”</p>
                            <p>
                            “You could pay them to let you work.”</p>
                            <p>
                            Carissa scoffed at Bolo, jumped down from the branch, and punched him in the shoulder. Bolo just laughed.</p>
                            <p>
                            “I know, I know,” said Bolo. “That defeats the purpose, the very thing you’re seeking. But I’m told there’s some gratification in helping the useless class.”</p>
                            <p>
                            “As if we—all of humanity—aren’t part of that same class...”</p>
                            <p>
                            That silenced Bolo. He thought of the studies he had just completed in AI and robotics. He could, in theory, work in his field, try to accomplish something. Except, he knew the Alphas who ran the world would just humour him, as nothing he could do would ever approach the sophistication that a garden-variety AI could now perform. It would be a hobby, the very thing Carissa had been struggling to find meaning in.</p>
                            <p>
                            “I would hate to quote your Mum to you,” said Bolo.</p>
                            <p>
                            “Oh god! Don’t you dare say that whole ‘lack of imagination’ nonsense to me. I will stop speaking to you.”</p>
                            <p>
                            Bolo burst out laughing, shifting out of the way as Carissa tried to punch his shoulder once more. She missed, hitting the trunk of the tree instead.</p>
                            <p>
                            “Oh shit!” said Bolo. “Are you ok?”</p>
                            <p>
                            She rubbed her fist, then put her hands on her waist and stuck her tongue out at Bolo. The expression made her look ten years old, despite being two years older than he was.</p>
                            <p>
                            Carissa was trained in a wider array of subjects, encompassing art, science, and engineering. Her imagination was her driving force. Despite what her mother told her when she entered these existential moods, she did not lack creative pursuits. But anything she did, anything anybody did, still paled in comparison to the work artificial intelligence could now perform.</p>
                            <p>
                            Carissa tensed, becoming distant. Small flashes on her contact lenses betrayed the projections in her gaze.</p>
                            <p>
                            “What’s wrong?” asked Bolo.</p>
                            <p>
                            “It’s nothing.”</p>
                            <p>
                            “I know you better than that. Is it your cousin?”</p>
                            <p>
                            Carissa nodded.</p>
                            <p>
                            “What is it this time?”</p>
                            <p>
                            “He was arrested in the Bodwell district. He needs me.”</p>
                            <p>
                            “Well, you wanted a purpose.”</p>
                            <p>
                            Carissa gave him a humourless look, erasing the smirk from his face.</p>
                            <p>
                            “Why do you need to get him out?”</p>
                            <p>
                            Sounds from the drone Carissa had called could already be heard. The two-person vehicle approached and descended slowly on its eight propellers. It settled on the grass near the tree, shifting its arms to the back to allow its doors to hinge wide open.</p>
                            <p>
                            “He’s already out,” said Carissa. “Alpha Eridi handled the lawsuit and settled the case while he was being apprehended and transported to our district. Norm had to pay a hefty fine out of his earnings as a shareholder, but otherwise he’s free to go.”</p>
                            <p>
                            “Still think it’s better to be poor?”</p>
                            <p>
                            She ignored him and walked towards the drone. “Are you coming or what? Norm says he’s got something to tell us in person.”</p>
                            <p>
                            He rushed to catch up and settled into the vehicle. The drone’s arms reverted to their extended position, propellers spun, and they lifted off.</p>
                            <p>
                            Bolo scanned his home and grounds. Several camouflaged robots tended to the gardens of his estate, visible only in their actions: a spray of water to remove an insect; a branch severed, disappearing from view; leaves dropping from the tree only to vanish before hitting the ground, caught and disposed of in mid-air. His four-storey mansion was likewise being maintained, renovated before he could even spot a failure, cleansed so that not a single blemish would mar its exterior.</p>
                            <p>
                            “Your house lacks character,” said Carissa. “At least simulate a weathered, aged look. Give it some personality. Anything other than this plasticky appearance.”</p>
                            <p>
                            “I happen to like this aesthetic, thank you very much.”</p>
                            <p>
                            Carissa shrugged. “You’re entitled to your poor choices.”</p>
                            <p>
                            They passed above a loose cluster of mansions, in varying degrees of gaudiness, from tasteless monstrosities to works of art. Bolo knew that the uglier the building, the more involved the human owner had been in the design; the AI architects were very accommodating.</p>
                            <p>
                            A maze of narrow asphalted trails linked the various estates, no wider than two humans abreast, with fencing and menacing bots guarding each entrance and exit. The gates were redundant as nearly everyone travelled by air.</p>
                            <p>
                            As they began their descent, a large grey-brick castle of medieval design filled Bolo’s view, its turrets holding automated guns, which trained on the drone as it landed. It would have provoked unease in Bolo had he not known that they were purely for show; their gun barrels were nothing but filled tubes. Even Carissa’s cousin had the sense to fear automated weaponry after living through the drone war.</p>
                            <p>
                            Norm had been a five-year-old at the time, yet it had shaped his personality, sparking in him a loathing of AI, despite inheriting a share of technology the Alphas themselves ran on.</p>
                            <p>
                            Norm waved at them as they exited the vehicle.</p>
                            <p>
                            “Thanks for coming, cous’,” said Norm. “Good! You brought the Benito kid.”</p>
                            <p>
                            “Kid?” said Carissa. “He’s more mature than you’ll ever be.”</p>
                            <p>
                            “Truer words were never uttered,” said Norm with a big grin on his face.</p>
                            <p>
                            They entered the castle, and Norm led them to a windowless room on the ground floor. He sealed it shut around them. The chamber was featureless, an empty cube, whose ceiling glowed with a warm light.</p>
                            <p>
                            Norm gestured with his fingers, interfacing with his devices. “Okay, we’re cut off from all surveillance, and no one can overhear us. I need to destroy your contact lenses.”</p>
                            <p>
                            Bolo and Carissa triggered the ejection mechanism on their contacts. It caused a thin layer of air to build under the lenses, popping them out of their eyes. Norm collected the lenses and crushed them into little balls, destroying their transparent circuitry.</p>
                            <p>
                            “Still paranoid, I see,” said Carissa.</p>
                            <p>
                            “One has to be when plotting the overthrow of the Alphas.”</p>
                            <p>
                            “An Alpha literally just saved your ass,” said Carissa. “Why are you so obsessed with their destruction?”</p>
                            <p>
                            “It’s them or us, and I’d rather it be us.”</p>
                            <p>
                            “You know the Alphas ended the war,” said Bolo. “Why are you opposed to them?”</p>
                            <p>
                            Norm sighed with irritation. “They have you well trained.”</p>
                            <p>
                            “Oh no, here comes the speech,” said Carissa.</p>
                            <p>
                            “Well, someone has to say it,” said Norm, shrugging. “They may have pacified the warring factions, but at what cost? They took away our independence, and then the few remaining jobs. They stole our very purpose.”</p>
                            <p>
                            Carissa opened her mouth to retort but then looked at Bolo and stopped.</p>
                            <p>
                            “We choose to use automation,” said Bolo. “The Alphas don’t force it on us.”</p>
                            <p>
                            “That might have been true a generation ago, but we got lazy, and now we have no other option but to use it. We don’t know how to function without it. Soon, even the poorer districts will lose their ability to self-manage. The open-source AIs will make them as dependent on automation as the rest of us are. Then, the Alphas’ takeover will be complete.”</p>
                            <p>
                            “Let’s say I believe you,” said Carissa. “I don’t, but… I’ll admit, some of it rang true. So how do you propose to solve the issue? You just said we are too late.”</p>
                            <p>
                            “We must isolate the poor districts. Remove all automation, prevent them from ever using it again, and restore the humans living there to a pre-AI state, pre-UBI.”</p>
                            <p>
                            Bolo and Carissa gazed at Norm with disbelief.</p>
                            <p>
                            “That would be the height of cruelty,” said Carissa. “How can you even suggest something like that?”</p>
                            <p>
                            “They’d revert to barbarism,” said Bolo. “The deaths and suffering…” He shook his head as though trying to drop the image from his head. “And you’re failing to understand the economics of the situation. Our wealth, that of all the shareholders, is dependent on the spending of the poor.”</p>
                            <p>
                            “You’re both wrong. Mostly wrong. Those cut off will regain the satisfaction that comes with independence, with the ability to take care of themselves. Sure, some will die, some suffer, but that’s part of life—what gives it meaning. We have lost some of that. Forgotten what it feels like to hurt. The magic pharmaceuticals the Alphas provide, the luxuries, and the automation of all the mundane tasks have put a ball and chain on each of our feet.</p>
                            <p>
                            “And Bolo, that economic conclusion is what I seek. Without the endless printing of coin to sustain UBI, spending ends, and the funnelling of funds to shareholders stops. Money will flow between the shareholders, but will never grow larger. Some of the wealthy will run out of funds, unable to pay for the automation, and become dependent on the expertise of the masses once more.”</p>
                            <p>
                            “You’ve lost your mind,” said Carissa.</p>
                            <p>
                            “I’m with her on this. And I won’t waste my breath describing the countless ways in which your argument is flawed.”</p>
                            <p>
                            “Why have you brought us here?” said Carissa. “Surely it wasn’t to fill our heads with this nonsense. What aren’t you telling us?”</p>
                            <p>
                            Norm’s face reddened, and he began pacing.</p>
                            <p>
                            “I did something towards my goal, but it went out of my control. The reason I was arrested was that I incited a riot.”</p>
                            <p>
                            “You did what?” said Carissa.</p>
                            <p>
                            “I gave one of my speeches in a square, after offering a substantial amount of money to the attendees. I had hired a local gang to spread the word. Except, Alpha Eridi refused to disburse the funds, causing the people to turn on the gang I hired, and well, things spiralled.”</p>
                            <p>
                            “Okay, that’s just fucked up,” said Carissa. “You’re such an idiot. That’s how you intend to help them?”</p>
                            <p>
                            “It still doesn’t explain why you brought us here,” said Bolo.</p>
                            <p>
                            “I was getting to that. I left something sensitive behind, but I have been banned from returning to that district. I need you to retrieve it for me.”</p>
                            <p>
                            “And that item is…” said Carissa.</p>
                            <p>
                            “Um, well… You won’t be happy… But, it needs to be retrieved…”</p>
                            <p>
                            “Quit stalling! What the fuck is it?”</p>
                            <p>
                            “It’s a backpack nuke.”</p>
                            <p>
                            Bolo’s jaw dropped while Carissa’s eyes were on the verge of popping from her skull.</p>
                            <p>
                            “Where do I even begin…?” said Carissa. “Why? How?”</p>
                            <p>
                            “It was meant as a bargaining chip, a way to force the Alphas to comply. It cost a fortune and took me two years of pulling strings just to get my hands on one.”</p>
                            <p>
                            “You are unhinged! And who would be dumb enough to trust you with a nuke?”</p>
                            <p>
                            Carissa went to town on Norm, but Bolo’s mind remained stuck on the nuclear device. Norm had said it was backpack-sized; the yield would be small yet still large enough to wipe out the entire district, possibly even contaminate the surrounding grounds—his home included. It had to be retrieved, but what would be the safest approach?</p>
                            <p>
                            The Alphas had to be informed.</p>
                            <p>
                            “We’ll do it,” said Bolo, stunning them both.</p>
                            <p>
                            “No, we fucking won’t.”</p>
                            <p>
                            Bolo locked eyes with Carissa and said, “We have to.” Her eyebrow twitched, but she got his intention.</p>
                            <p>
                            Norm rubbed his hands together. “Excellent, I’ll tell you who to contact, and you can arrange to bring it here.”</p>
                            <p>
                            Norm led them out of the room, mimed closing a zipper over his lips, and provided them with new lenses which they placed in their eyes. Bolo’s device synced with the cloud, and a pastry chef’s contact information appeared in his inbox.</p>
                            <p>
                            “I sent you the details on how to contact the best pastry chef in the area. His croissants are explosive. They’re to die for.”</p>
                            <p>
                            Carissa shook her head, mouthing something that Bolo read as “fucking idiot.”</p>
                            <p>
                            They said their goodbyes, left Norm, and returned to Bolo’s home, not uttering a word on their entire journey back.</p>
                            <p>
                            Norm was not much of an outlier when it came to mischief brought on by an excess of idle time. The desire to relieve the ennui resulted in frequent poor behaviour, yet others kept to minor infractions, basic destruction that the automation could easily remedy. What Norm planned seemed far beyond anything Bolo could have predicted. It made him doubt the veracity of what they had been told.</p>
                            <p class="obsolescence-separator">***</p>
                            <p class="obsolescence-new-section">
                            As Bolo entered his home, he released the breath that he had been holding. He and Carissa settled on sofas in what used to be the kitchen before the robotics servitors had rendered it irrelevant. Drinks and snacks were provided without their asking; the robots were hardly noticeable as they ran about their tasks.</p>
                            <p>
                            “So what do you suggest we do?” asked Carissa. “I assumed from your look that you had a plan.”</p>
                            <p>
                            “We have to turn him in even if his entire story was made up. We can’t risk it.”</p>
                            <p>
                            She sighed. “I feel really bad for that idiot.” She went on to curse him to hell and back, inventing new swear words when she had exhausted her supply.</p>
                            <p>
                            “We can’t actually do what he asks. We would be complicit.”</p>
                            <p>
                            “I know. I know.”</p>
                            <p>
                            She linked to Bolo’s device and connected them both with Alpha Eridi.</p>
                            <p>
                            The avatar of a chimpanzee in a suit appeared in front of them, projected from their contacts. The chimp reached behind him, collected something brown, then threw it towards their faces, screeching the word “traitors” over and over.</p>
                            <p>
                            “What the actual fuck?” said Carissa. “That asshole tricked us.”</p>
                            <p>
                            Bolo ejected the compromised lenses from his eyes, and Carissa followed suit. “Was this all some prank? Did your cousin make all that shit up?”</p>
                            <p>
                            Carissa stood up, shaking with anger. She massaged her temples. “I don’t know what to believe. Pranks of this magnitude are not his style. If anything, it makes me think his story might be true. If he went to the trouble to compromise these lenses, to program a countermeasure in case we betrayed him, it implies he truly has something to hide.”</p>
                            <p>
                            “I’ll get us new lenses,” said Bolo.</p>
                            <p>
                            “Norm would have informed his contact by now, reverting to a backup plan. Who knows how many means of misdirection he had planned. But fuck it, let’s tell Alpha Eridi everything anyway.”</p>
                            <p>
                            Bolo lifted his hand, signalling a robotic servitor to approach. The robot, built to look like a human butler, walked with a slow gait towards him. Bolo made his request, and the butler opened its palm to reveal the two pairs of lenses it had disgorged from its forearm supply.</p>
                            <p>
                            Bolo and Carissa placed the lenses in their eyes and repeated the connection from before.</p>
                            <p>
                            This time the expected avatar of Alpha Eridi, a short person with an androgynous face, projected through their lenses. It waited for their input.</p>
                            <p>
                            “We have a bit of a situation to report…” said Carissa. She and Bolo relayed all that had occurred since meeting Norm at his home.</p>
                            <p>
                            “I have received a similar report about the two of you,” said Alpha Eridi. “Due to the severity of the accusations, I have no other option but to assume command over your automation, freeze your assets, and confine you at your location until such a time as I have ascertained your innocence.”</p>
                            <p>
                            “But we did nothing wrong,” said Bolo. “It was Norm!”</p>
                            <p>
                            Bolo gazed at Carissa, waiting for her impending outburst. But Carissa maintained her composure, turning crimson, seeming on the verge of exploding. With gritted teeth, she asked, “What do you intend to do?”</p>
                            <p>
                            “You will be informed once the situation has been resolved.” Its avatar blinked away.</p>
                            <p>
                            Bolo felt his face drain of blood. He collapsed onto the sofa, hyperventilating, barely able to hear Carissa as she smashed plates, ripped a pillow in half, all the while cursing incoherently. Small scurrying bots collected the debris as Bolo became entranced by a feather falling gently to the ground.</p>
                            <p>
                            Bolo tried to leave the house, but was prevented by his own robotic staff. The Alphas did not have this power—should not have it. Bolo was a shareholder; his privileges regarding his automation, in his own house, were supposed to be unmatched.</p>
                            <p>
                            Perhaps he had been wrong, and Norm was right.</p>
                            <p>
                            “Let’s check our access,” said Carissa.</p>
                            <p>
                            Bolo had already done so. “We can listen to media, but not transmit. I found a broadcast.”</p>
                            <p>
                            They linked their devices and watched the live transmission from a teenage resident in Bodwell district. The commentary was alarming but without much substance. It was the footage that left them stunned.</p>
                            <p>
                            A swarm of military drones descended on the district, some dropping robotic ground troops, while others flew above in a grid-like pattern. They would be scanning, likely for that radiological device.</p>
                            <p>
                            The ground drones were collecting anyone who crossed their path, tying their hands, searching their bodies, and containing them behind the advancing troops. Only police officers were out, due to the earlier riots and the curfew now in effect. Some officers resisted, but they were subdued with little effort.</p>
                            <p>
                            When the footage turned to the district square, evidence of the riot Norm had incited was revealed. The ground was covered with litter and broken glass. Bodwell had a few robotic servitors, and any humans hired for such cleaning tasks would be indoors.</p>
                            <p>
                            The mess grated on Bolo, who was unused to seeing such disorder. He cut the feed, and Carissa replaced it with a news broadcast.</p>
                            <p>
                            “We have reports of military action in Bodwell district,” said the broadcaster. Several new windows with footage of the robotic invasion appeared around her. “The Alphas refused to comment on the reason for the descent on Bodwell, but it appears they are searching for someone, or something. In perhaps related news, at least fifteen estates have become inaccessible in the shareholder districts surrounding Bodwell, matching the pattern of house arrest. The Alphas would not comment on this matter either.”</p>
                            <p>
                            Carissa silenced the feed. “What the actual fuck?”</p>
                            <p>
                            “I don’t know if I should feel insulted or relieved that we’re not the only ones tangled in Norm’s plot.”</p>
                            <p>
                            “I think I get what the motherfucker is trying to do. He’s forcing the Alphas’ hands, making them assert their control again, as they did in the war. Except, this will seem arbitrary and turn everyone against them.”</p>
                            <p>
                            Bolo returned his focus to the broadcasts, seeing the efficient brutality of the robotic military. The anger and distrust were apparent on the faces visible in the feed. “It won’t make any difference. The Alphas will rightly lay the blame on Norm, and the propaganda will pacify everyone once more.”</p>
                            <p>
                            That was when everything went dark, and their lenses ceased to function.</p>
                            <p>
                            Carissa paled. “Do you think the nuke went off?”</p>
                            <p>
                            Bolo hadn’t thought of that. Now he could think of nothing else. Were they safe? Then realization dawned that countless lives might have been lost. “Wait, no, it can’t be. Norm might have his flaws, but he isn’t a homicidal maniac.”</p>
                            <p>
                            That’s when he registered a new sound, or the lack of one. All the automation had gone silent. They walked to a servitor, but found it lifeless. An EMP would not have reached this far, not one from a backpack nuke. And Alpha Eridi wanted them confined; it wouldn’t have shut down the very automation that performed its tasks.</p>
                            <p>
                            There was another possibility, though Bolo dreaded to entertain it. The Alphas might have chosen to abandon them, retreating to the orbital platforms. Humanity had become redundant, a nuisance, an unnecessary distraction wasting processing time.</p>
                            <p>
                            He heard himself laugh, an uncontrolled, hysterical sound. “I think you got your wish, Carissa. Everything we will do from now on will matter, or else we won’t survive.”</p>
                        </div>
